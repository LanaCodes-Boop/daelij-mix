name: Windows build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Daelij MiX v__VERSION__ (test)'
          releaseBody: |
            Test build for Windows 10/11.

            **Install:** download `Daelij.MiX_..._x64-setup.exe` below and run it.
            Windows may say "Windows protected your PC" because the app is not signed yet: click **More info → Run anyway**.

            What works: Game / Chat / Media / Aux faders change the real volume of the apps on them, live meters, scenes, undo/redo.
            New in 0.2: Mix B (stream) is real. Install the free VB-Cable, then in OBS add Audio Input Capture → CABLE Output. Needs Windows 11.
            Still a preview: the effects (EQ, compressor, gate, noise reduction).
          releaseDraft: false
          prerelease: true
